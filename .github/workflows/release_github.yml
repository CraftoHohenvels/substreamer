name: Create release

on:
  push:
    tags:
      - "*"
  workflow_dispatch: { }
permissions:
  contents: write

jobs:
  github:
    name: Release pushed tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Install expo
        run: npm install expo

      - name: Run prebuild with expo only for android
        run: npx expo prebuild -p android
      - name: set up java - 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease -Dorg.gradle.jvmargs='-Xmx4g'


      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./android/app/build/outputs/apk/release/*.apk
          draft: true
